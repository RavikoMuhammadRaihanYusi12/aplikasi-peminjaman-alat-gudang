<!-- Modal Overlay for Return confirmation -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs transition-opacity"
     id="dialog-modal"
     onclick="if(event.target === this) document.getElementById('dialog').innerHTML = ''">
  <div class="bg-white rounded-3xl shadow-2xl border-2 border-slate-300 max-w-xl w-full p-6 sm:p-8 transform transition-all overflow-hidden"
       onclick="event.stopPropagation()">
    
    <!-- Header -->
    <div class="flex items-start justify-between pb-4 border-b border-slate-200">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-3 py-1 rounded-md">Konfirmasi Pengembalian</span>
        <h3 class="text-2xl sm:text-3xl font-black text-slate-900 mt-2">
          {{.Loan.ToolName}}
        </h3>
        <div class="text-lg text-slate-600 font-semibold mt-1">
          Kode: <span class="font-mono text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded">{{.Loan.ToolCode}}</span> &bull; Peminjam: <span class="text-slate-900 font-bold">{{.Loan.TechnicianName}}</span>
        </div>
      </div>
      <button type="button" 
              onclick="document.getElementById('dialog').innerHTML = ''"
              class="w-12 h-12 flex items-center justify-center rounded-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 text-2xl font-bold cursor-pointer transition-colors">
        &times;
      </button>
    </div>

    <!-- Body / Initial 2-Choice Options -->
    <div id="kembali-initial" class="py-6 space-y-4">
      <p class="text-lg font-medium text-slate-700">Bagaimana kondisi alat saat dikembalikan?</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- 1-Click Fast Return "BAIK" -->
        <form hx-post="/kembali/{{.Loan.ID}}" 
              hx-target="#dialog" 
              hx-swap="innerHTML"
              hx-vals='{"kondisi": "baik", "catatan": ""}'
              class="w-full">
          <button type="submit" 
                  hx-disabled-elt="this"
                  class="w-full min-h-24 p-5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-2xl shadow-md flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:scale-[1.02] focus:ring-4 focus:ring-emerald-300">
            <svg class="w-10 h-10 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <span class="text-2xl font-black tracking-wide">KONDISI BAIK</span>
            <span class="text-xs text-emerald-100 font-medium mt-1">Siap dipinjamkan kembali</span>
          </button>
        </form>

        <!-- Option "ADA KERUSAKAN" -->
        <button type="button" 
                onclick="document.getElementById('kembali-initial').classList.add('hidden'); document.getElementById('kembali-rusak-form').classList.remove('hidden');"
                class="w-full min-h-24 p-5 bg-rose-50 hover:bg-rose-100 active:bg-rose-200 text-rose-800 border-2 border-rose-300 rounded-2xl shadow-sm flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:scale-[1.02] focus:ring-4 focus:ring-rose-200">
          <svg class="w-10 h-10 mb-1 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <span class="text-2xl font-black tracking-wide">ADA KERUSAKAN</span>
          <span class="text-xs text-rose-600 font-medium mt-1">Perlu perbaikan gudang</span>
        </button>
      </div>
    </div>

    <!-- Sub-Form if Damaged Selected -->
    <div id="kembali-rusak-form" class="hidden py-4 space-y-5">
      <div class="bg-rose-50 border border-rose-200 p-4 rounded-xl flex items-center gap-3 text-rose-900">
        <svg class="w-6 h-6 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span class="text-sm font-semibold">Alat akan ditandai <strong class="font-bold underline">RUSAK</strong> dan tidak dapat dipinjam sampai diperbaiki.</span>
      </div>

      <form hx-post="/kembali/{{.Loan.ID}}" 
            hx-target="#dialog" 
            hx-swap="innerHTML">
        <input type="hidden" name="kondisi" value="rusak">
        
        <div>
          <label class="block text-base font-bold text-slate-800 mb-2">Pilih Jenis Kerusakan (Klik salah satu):</label>
          <div class="grid grid-cols-2 gap-2.5" id="damage-chips">
            <label class="chip-option" onclick="selectChip(this, 'Tidak menyala')">
              <input type="radio" name="chip" value="Tidak menyala" class="sr-only">
              <span class="text-lg font-bold">🔌 Tidak menyala</span>
            </label>
            <label class="chip-option" onclick="selectChip(this, 'Patah/aus')">
              <input type="radio" name="chip" value="Patah/aus" class="sr-only">
              <span class="text-lg font-bold">🔨 Patah / aus</span>
            </label>
            <label class="chip-option" onclick="selectChip(this, 'Aksesori hilang')">
              <input type="radio" name="chip" value="Aksesori hilang" class="sr-only">
              <span class="text-lg font-bold">📦 Aksesori hilang</span>
            </label>
            <label class="chip-option" onclick="selectChip(this, 'Lainnya')">
              <input type="radio" name="chip" value="Lainnya" class="sr-only">
              <span class="text-lg font-bold">⚠️ Lainnya</span>
            </label>
          </div>
        </div>

        <div class="mt-4">
          <label for="catatan_rusak" class="block text-base font-bold text-slate-800 mb-1">Catatan Tambahan (Opsional):</label>
          <input type="text" 
                 id="catatan_rusak"
                 name="catatan" 
                 placeholder="Contoh: Kabel putus dekat colokan"
                 class="w-full text-lg px-4 py-3 border-2 border-slate-300 rounded-xl focus:border-rose-500 focus:ring-4 focus:ring-rose-200 outline-none">
        </div>

        <div class="mt-6 flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
          <button type="button" 
                  onclick="document.getElementById('kembali-rusak-form').classList.add('hidden'); document.getElementById('kembali-initial').classList.remove('hidden');"
                  class="btn-secondary min-h-12 py-2 px-5 text-base">
            Kembali
          </button>
          <button type="submit" 
                  hx-disabled-elt="this"
                  class="btn-danger min-h-12 py-2 px-6 text-lg">
            Simpan Kerusakan
          </button>
        </div>
      </form>
    </div>

    <!-- Footer Cancel -->
    <div class="pt-4 border-t border-slate-100 flex justify-end">
      <button type="button" 
              onclick="document.getElementById('dialog').innerHTML = ''"
              class="px-5 py-2.5 text-slate-600 hover:text-slate-900 font-bold text-base hover:bg-slate-100 rounded-xl transition-colors cursor-pointer">
        Batal (Jangan Ubah)
      </button>
    </div>
  </div>
</div>

<script>
  function selectChip(element, val) {
    document.querySelectorAll('#damage-chips .chip-option').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
    const noteInput = document.getElementById('catatan_rusak');
    if (noteInput && !noteInput.value) {
      noteInput.value = val;
    }
  }
</script>
