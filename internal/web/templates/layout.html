<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true}]}'>
  <title>{{block "title" .}}Alat Gudang - Pos Gudang Sparepart{{end}}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col">
  <!-- Top Navigation Header -->
  <header class="bg-white border-b-2 border-slate-300 shadow-sm sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <!-- Logo & Navigation Tabs -->
        <div class="flex items-center gap-8">
          <a href="/" class="flex items-center gap-3 group focus:outline-none focus:ring-4 focus:ring-emerald-300 rounded-xl p-1">
            <div class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-black text-2xl shadow-inner">
              AG
            </div>
            <div>
              <div class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2">
                ALAT GUDANG
                <span class="text-xs px-2 py-0.5 bg-slate-200 text-slate-700 font-bold rounded-md">POS SPAREPART</span>
              </div>
              <div class="text-xs text-slate-500 font-semibold tracking-wide">Pencatatan Cepat & Terpercaya</div>
            </div>
          </a>

          <!-- Main Nav Links -->
          <nav class="hidden md:flex items-center gap-2">
            <a href="/" 
               class="px-5 py-3 rounded-xl font-bold text-lg transition-colors flex items-center gap-2 {{if eq .ActiveNav "beranda"}}bg-slate-900 text-white shadow-sm{{else}}text-slate-700 hover:bg-slate-200{{end}}">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
              </svg>
              Beranda
            </a>
            <a href="/alat" 
               class="px-5 py-3 rounded-xl font-bold text-lg transition-colors flex items-center gap-2 {{if eq .ActiveNav "alat"}}bg-slate-900 text-white shadow-sm{{else}}text-slate-700 hover:bg-slate-200{{end}}">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
              </svg>
              Semua Alat
            </a>
            <a href="/kelola/alat" 
               class="px-5 py-3 rounded-xl font-bold text-lg transition-colors flex items-center gap-2 {{if eq .ActiveNav "kelola"}}bg-slate-900 text-white shadow-sm{{else}}text-slate-700 hover:bg-slate-200{{end}}">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              Kelola
            </a>
          </nav>
        </div>

        <!-- Right Side: Clock & Main Action -->
        <div class="flex items-center gap-4">
          <!-- Live Shift & Date Indicator -->
          <div class="hidden xl:flex flex-col text-right pr-2 border-r-2 border-slate-200">
            <span class="text-base font-bold text-slate-800" id="live-clock">--:-- WIB</span>
            <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full inline-block mt-0.5">Shift Aktif</span>
          </div>

          <!-- Big Main Action Button -->
          <a href="/pinjam" 
             class="btn-primary text-xl font-black py-4 px-7 shadow-lg shadow-emerald-700/20 active:scale-95 transition-transform flex items-center gap-3">
            <svg class="w-7 h-7 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>＋ PINJAMKAN ALAT</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4 empty:hidden">
    {{block "toast_content" .}}{{end}}
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    {{block "content" .}}{{end}}
  </main>

  <!-- Modal Dialog Container (Loaded via htmx) -->
  <div id="dialog" class="empty:hidden"></div>

  <!-- Simple status footer -->
  <footer class="bg-white border-t border-slate-200 py-3 text-center text-sm text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
      <span>Pos Komputer Gudang Sparepart &bull; Tanpa Internet &bull; Hanya Perlu Mouse</span>
      <span class="font-mono text-xs text-slate-400">Versi 0.1 MVP</span>
    </div>
  </footer>

  <script>
    // Simple client-side clock updater for pos display
    function updateClock() {
      const el = document.getElementById('live-clock');
      if (!el) return;
      const now = new Date();
      const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const dayName = days[now.getDay()];
      const day = now.getDate();
      const month = months[now.getMonth()];
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${dayName}, ${day} ${month} - ${hours}:${mins} WIB`;
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>
</body>
</html>
